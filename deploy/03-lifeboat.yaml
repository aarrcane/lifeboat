# Secrets `lifeboat-secrets` (HMAC key) and `lifeboat-s3` are created by `make secrets`
# from your local .env; they are never committed.
apiVersion: apps/v1
kind: Deployment
metadata: {name: lifeboat, namespace: lifeboat}
spec:
  replicas: 2                     # one active (Lease holder) + one standby
  selector: {matchLabels: {app: lifeboat}}
  template:
    metadata:
      labels: {app: lifeboat}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "9100"}
    spec:
      serviceAccountName: lifeboat
      priorityClassName: lifeboat-system
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector: {matchLabels: {app: lifeboat}}
      containers:
        - name: lifeboat
          image: lifeboat/controller:latest
          imagePullPolicy: IfNotPresent
          # lifeboat-s3 (05-checkpoint-store.yaml): same bucket/endpoint/keys as the workers
          envFrom: [{secretRef: {name: lifeboat-secrets}}, {secretRef: {name: lifeboat-s3}}]
          env:
            - {name: LIFEBOAT_IDENTITY, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: LIFEBOAT_EARLY_WARNING, value: "true"}         # "false" => baseline B2
          ports:
            - {name: ingest, containerPort: 8081}
            - {name: metrics, containerPort: 9100}
          # kopf's liveness endpoint (--liveness in the Dockerfile). The delay covers startup,
          # which waits for the S3 bucket.
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 30, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 256Mi}}
---
# Headless: feeds resolve every pod IP and send each reading to BOTH replicas.
apiVersion: v1
kind: Service
metadata: {name: lifeboat-ingest, namespace: lifeboat}
spec:
  clusterIP: None
  selector: {app: lifeboat}
  ports: [{name: ingest, port: 8081}, {name: metrics, port: 9100}]
