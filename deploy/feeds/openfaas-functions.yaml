# OpenFaaS Function CRs (faas-netes operator mode) matching feeds/stack.yml.
# Applied by `make feeds` (scripts/deploy-feeds.sh) after installing OpenFaaS + cron-connector
# and syncing `lifeboat-secrets` into `openfaas-fn`.
apiVersion: openfaas.com/v1
kind: Function
metadata:
  name: pub-feed
  namespace: openfaas-fn
spec:
  name: pub-feed
  image: lifeboat/pub-feed:latest
  annotations:
    topic: cron-function
    schedule: "*/2 * * * *"
  environment:
    FEED_SOURCE: "S1"
    PUB_URL: "https://api-open.data.gov.sg/v2/real-time/api/weather/flood-alerts"
    PUB_TTL_S: "150"
    LIFEBOAT_INGEST_HOST: "lifeboat-ingest.lifeboat.svc.cluster.local"
    LIFEBOAT_INGEST_PORT: "8081"
  secrets:
    - lifeboat-secrets
  requests:
    cpu: 50m
    memory: 64Mi
---
apiVersion: openfaas.com/v1
kind: Function
metadata:
  name: nea-feed
  namespace: openfaas-fn
spec:
  name: nea-feed
  image: lifeboat/nea-feed:latest
  annotations:
    topic: cron-function
    schedule: "*/5 * * * *"
  environment:
    FEED_SOURCE: "S2"
    NEA_URL: "https://api-open.data.gov.sg/v2/real-time/api/rainfall"
    NEA_TTL_S: "330"
    NEA_L1_MM: "2.5"
    NEA_L2_MM: "7.5"
    LIFEBOAT_INGEST_HOST: "lifeboat-ingest.lifeboat.svc.cluster.local"
    LIFEBOAT_INGEST_PORT: "8081"
  secrets:
    - lifeboat-secrets
  requests:
    cpu: 50m
    memory: 64Mi

