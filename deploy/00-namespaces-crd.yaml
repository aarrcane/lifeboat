apiVersion: v1
kind: Namespace
metadata: {name: lifeboat}
---
apiVersion: v1
kind: Namespace
metadata: {name: lifeboat-demo}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: triageplans.lifeboat.sit.edu}
spec:
  group: lifeboat.sit.edu
  scope: Namespaced
  names: {kind: TriagePlan, plural: triageplans, singular: triageplan, shortNames: [tp]}
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec: {type: object, x-kubernetes-preserve-unknown-fields: true}
      additionalPrinterColumns:
        - {name: Level, type: integer, jsonPath: .spec.level}
        - {name: Takeover, type: integer, jsonPath: .spec.takeover}
