# Checkpoint store shared by the controller (namespace lifeboat) and the C3/C4 workers
# (namespace lifeboat-demo). Both need the SAME endpoint, bucket and keys, so the Secret
# is created in both namespaces. Apply before 03-lifeboat.yaml and 04-demo-workloads.yaml.
#
# Laptop / k3s: MinIO below (dev credentials, data lost when the pod restarts). The bucket is
#               created by whichever of the controller or a worker starts first.
# AWS run:      delete the MinIO Deployment/Service, set LIFEBOAT_S3_ENDPOINT to "" and put the
#               IAM user's keys + region in both Secrets.
apiVersion: v1
kind: Secret
metadata: {name: lifeboat-s3, namespace: lifeboat}
stringData:
  LIFEBOAT_CHECKPOINT_BACKEND: s3
  LIFEBOAT_S3_BUCKET: lifeboat-checkpoints
  LIFEBOAT_S3_ENDPOINT: http://minio.lifeboat.svc.cluster.local:9000
  AWS_ACCESS_KEY_ID: lifeboat
  AWS_SECRET_ACCESS_KEY: lifeboat-dev-change-me
  AWS_DEFAULT_REGION: us-east-1
---
apiVersion: v1
kind: Secret
metadata: {name: lifeboat-s3, namespace: lifeboat-demo}
stringData:                       # keep identical to the Secret above
  LIFEBOAT_CHECKPOINT_BACKEND: s3
  LIFEBOAT_S3_BUCKET: lifeboat-checkpoints
  LIFEBOAT_S3_ENDPOINT: http://minio.lifeboat.svc.cluster.local:9000
  AWS_ACCESS_KEY_ID: lifeboat
  AWS_SECRET_ACCESS_KEY: lifeboat-dev-change-me
  AWS_DEFAULT_REGION: us-east-1
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: minio, namespace: lifeboat}
spec:
  replicas: 1
  selector: {matchLabels: {app: minio}}
  template:
    metadata: {labels: {app: minio}}
    spec:
      priorityClassName: lifeboat-system
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
          args: [server, /data, --console-address, ":9001"]
          env:
            - {name: MINIO_ROOT_USER, valueFrom: {secretKeyRef: {name: lifeboat-s3, key: AWS_ACCESS_KEY_ID}}}
            - {name: MINIO_ROOT_PASSWORD, valueFrom: {secretKeyRef: {name: lifeboat-s3, key: AWS_SECRET_ACCESS_KEY}}}
          ports: [{name: api, containerPort: 9000}, {name: console, containerPort: 9001}]
          readinessProbe: {httpGet: {path: /minio/health/ready, port: 9000}, periodSeconds: 5}
          volumeMounts: [{name: data, mountPath: /data}]
          resources: {requests: {cpu: 100m, memory: 256Mi}}
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: minio, namespace: lifeboat}
spec:
  selector: {app: minio}
  ports: [{name: api, port: 9000}, {name: console, port: 9001}]
