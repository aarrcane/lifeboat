# MinIO: the S3 checkpoint store for laptop / k3d runs. Shared by the controller
# (namespace lifeboat) and the C3/C4 workers (namespace lifeboat-demo).
#
# The `lifeboat-s3` Secret is NOT in git. `make secrets` (scripts/make-secrets.sh) creates it
# in both namespaces from your local .env, generating random keys on the first run.
#
# Laptop / k3d: S3_MODE=minio (default). This file is applied; data is lost when the pod
#               restarts, which `make reset` uses to wipe checkpoints between runs.
# AWS run:      S3_MODE=aws. This file is NOT applied; the Secret points at a real S3 bucket
#               and the pods get credentials from the EC2 instance profile (LabRole).
apiVersion: apps/v1
kind: Deployment
metadata: {name: minio, namespace: lifeboat}
spec:
  replicas: 1
  selector: {matchLabels: {app: minio}}
  template:
    metadata: {labels: {app: minio}}
    spec:
      priorityClassName: lifeboat-system
      containers:
        - name: minio
          image: bitnamilegacy/minio:2025.7.23-debian-12-r5
          env:
            - {name: MINIO_ROOT_USER, valueFrom: {secretKeyRef: {name: lifeboat-s3, key: AWS_ACCESS_KEY_ID}}}
            - {name: MINIO_ROOT_PASSWORD, valueFrom: {secretKeyRef: {name: lifeboat-s3, key: AWS_SECRET_ACCESS_KEY}}}
          ports: [{name: api, containerPort: 9000}, {name: console, containerPort: 9001}]
          readinessProbe: {httpGet: {path: /minio/health/ready, port: 9000}, periodSeconds: 5}
          volumeMounts: [{name: data, mountPath: /bitnami/minio/data}]
          resources: {requests: {cpu: 100m, memory: 256Mi}}
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: minio, namespace: lifeboat}
spec:
  selector: {app: minio}
  ports: [{name: api, port: 9000}, {name: console, port: 9001}]
